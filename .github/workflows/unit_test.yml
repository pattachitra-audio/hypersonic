name: Unit test

on:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        environment: unit_test

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Install dependencies
              run: pnpm install

            - name: Run tests
              run: pnpm run unit-test
